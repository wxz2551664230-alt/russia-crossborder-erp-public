[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "russia-crossborder-erp"
version = "0.1.0"
description = "俄罗斯跨境 ERP：统一店铺、接口、选品、上架和任务中心"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
  "alibabacloud-oss-v2>=1.3,<2",
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
