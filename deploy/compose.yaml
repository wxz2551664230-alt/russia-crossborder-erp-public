services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ERP_RUNTIME_MODE: server
      ERP_ENVIRONMENT: staging
      ERP_HOST: 0.0.0.0
      ERP_PORT: 8788
      ERP_DATA_DIR: /var/lib/erp
      ERP_FRONTEND_DIST: /app/frontend/dist
      ERP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - erp-data:/var/lib/erp
    ports:
      - "127.0.0.1:8789:8788"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 768m

volumes:
  postgres-data:
  erp-data:
